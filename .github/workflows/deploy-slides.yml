name: Deploy Marp Slides to GitHub Pages
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Build Directory
        run: mkdir -p build

      - name: Copy Images to Build
        # This safely copies your 'img' folder into the temporary web 'build' folder
        run: cp -r img build/

      - name: Convert Markdown to HTML
        uses: KoharaKazuya/marp-cli-action@v4
        with:
          args: slides.md -o build/index.html --html

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true # <-- This fixes the "HttpError: Not Found" automatically!

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
